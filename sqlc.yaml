version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/queries"
    schema: "internal/store/schema.sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "books.owned_physical"
            go_type: "int64"
          - column: "books.owned_digital"
            go_type: "int64"
